<svg class="vtol-svg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="rotorGrad">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Hauptflügel -->
  <ellipse cx="200" cy="180" rx="180" ry="22" fill="url(#bodyGrad)" opacity="0.4"/>

  <!-- Wing-Hauptbalken -->
  <rect x="40" y="170" width="320" height="14" rx="7" fill="url(#bodyGrad)"/>

  <!-- Rumpf -->
  <path d="M 130 195 L 270 195 L 290 240 L 280 270 L 200 280 L 120 270 L 110 240 Z" fill="url(#bodyGrad)" opacity="0.95"/>

  <!-- Höhenleitwerk hinten -->
  <rect x="270" y="190" width="60" height="6" rx="3" fill="#4f46e5"/>
  <rect x="265" y="186" width="50" height="14" rx="3" fill="#4f46e5" opacity="0.7"/>

  <!-- Vorderansicht Kamera -->
  <circle cx="200" cy="265" r="12" fill="#06b6d4" opacity="0.8"/>
  <circle cx="200" cy="265" r="6" fill="#0a0e1a"/>

  <!-- 4 Rotoren mit Rotation -->
  <g class="vtol-rotor">
    <circle cx="80" cy="160" r="28" fill="url(#rotorGrad)"/>
    <path d="M 60 160 L 100 160 M 80 140 L 80 180" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g class="vtol-rotor">
    <circle cx="320" cy="160" r="28" fill="url(#rotorGrad)"/>
    <path d="M 300 160 L 340 160 M 320 140 L 320 180" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g class="vtol-rotor">
    <circle cx="100" cy="265" r="28" fill="url(#rotorGrad)"/>
    <path d="M 80 265 L 120 265 M 100 245 L 100 285" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g class="vtol-rotor">
    <circle cx="300" cy="265" r="28" fill="url(#rotorGrad)"/>
    <path d="M 280 265 L 320 265 M 300 245 L 300 285" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Pusher hinten -->
  <circle cx="350" cy="195" r="16" fill="url(#rotorGrad)" opacity="0.6"/>
  <circle cx="350" cy="195" r="8" fill="#06b6d4" opacity="0.9"/>

  <!-- Sensoren (LEDs) -->
  <circle cx="200" cy="280" r="3" fill="#f4a836" opacity="0.9"/>
  <circle cx="180" cy="280" r="3" fill="#f4a836" opacity="0.7"/>
  <circle cx="220" cy="280" r="3" fill="#f4a836" opacity="0.7"/>

  <!-- Connection Lines (subtle) -->
  <line x1="80" y1="160" x2="180" y2="220" stroke="#4f46e5" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  <line x1="320" y1="160" x2="220" y2="220" stroke="#4f46e5" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
</svg>
