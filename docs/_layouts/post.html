---
layout: default
---
<article class="post">

    <header class="post-header">
        <div class="post-meta">{{ page.date | date: "%d.%m.%Y" }} · {% if page.categories %}{{ page.categories | join: ', ' | capitalize }}{% endif %}</div>
        <h1>{{ page.title }}</h1>
        {% if page.excerpt %}
        <p class="post-excerpt">{{ page.excerpt | strip_html }}</p>
        {% endif %}
    </header>

    <div class="post-content">
        {{ content }}
    </div>

    <footer class="post-footer">
        <p><a href="{{ '/' | relative_url }}">← Zurück zur Übersicht</a></p>
    </footer>

</article>
