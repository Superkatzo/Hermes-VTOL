name: Markdown Lint

on:
  push:
    branches: [main]
    paths:
      - '**.md'
    paths-ignore:
      # SPAM-FIX 2026-09-24: Todo-/Chronik-Commits loesen keinen Lint mehr aus
      - '01_Dokumentation/Todos/**'
      - 'docs/_posts/**'
      - 'CHANGELOG.md'
  pull_request:
    branches: [main]
    paths:
      - '**.md'
    paths-ignore:
      - '01_Dokumentation/Todos/**'
      - 'docs/_posts/**'
      - 'CHANGELOG.md'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: |
          markdownlint '**/*.md' \
            --disable MD013 \
            --disable MD024 \
            --disable MD033 \
            --disable MD060 \
            --ignore build/
